 'Dear Professor Williams,\n\nI am writing to ask whether I could submit my assignment one day late. I have been working on the research paper, but I encountered an unexpected problem with one of my sources. As a result, I need additional time to check the information and revise my argument.\n\nI understand that deadlines are important, and I apologize for the inconvenience. Would it be possible to submit the paper by Friday evening instead? I would greatly appreciate your consideration.\n\nBest regards,\nAlex',
 'I agree that universities should offer more opportunities for practical experience. Although theoretical knowledge is essential, students also need to understand how to apply what they learn in real situations.\n\nFor example, internships allow students to develop professional skills, work with experienced colleagues, and explore potential careers. These opportunities can also help them identify their strengths and weaknesses before graduation.\n\nTherefore, combining academic instruction with practical training would make university education more effective.',

 function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
 function countCorrect(text,ref){let k=0;for(let i=0;i<text.length;i++)if(text[i]===ref[i])k++;return k}
 function display(){const ref=expected();let html='';for(let i=0;i<ref.length;i++){let cls=i<typed.length?(typed[i]===ref[i]?'correct':'incorrect'):'remaining';html+='<span class="'+cls+'">'+esc(ref[i])+'</span>'} $('target').innerHTML=html;$('completed').textContent=completed;$('acc').textContent=(entries?Math.round(100*correctEntries/entries):100)+'%';let elapsed=active?Math.min(duration,(performance.now()-started)/1000):finished?duration:0;const accurate=completedChars+countCorrect(typed,ref);$('wpm').textContent=elapsed>0?Math.round(accurate/5/(elapsed/60)):0;$('bar').style.width=Math.min(100,(typed.length/ref.length)*100)+'%';}
 function clock(){remaining=Math.max(0,duration-(performance.now()-started)/1000);$('time').textContent=Math.floor(Math.ceil(remaining)/60)+':'+String(Math.ceil(remaining)%60).padStart(2,'0');display();if(remaining<=0){finish();return}raf=requestAnimationFrame(clock)}
 function reset(){cancelAnimationFrame(raf);active=false;finished=false;duration=Number($('dur').value);kind=$('kind').value;remaining=duration;shuffle();index=0;typed='';entries=0;correctEntries=0;completedChars=0;completed=0;prevValue='';input.value='';input.disabled=true;$('dur').disabled=false;$('kind').disabled=false;$('start').disabled=false;$('result').classList.remove('show');$('mascot').style.display='flex';$('dino').src=mascots.neutral;$('dinoText').textContent='Accuracy first. Speed follows.';$('message').textContent='Ready when you are.';$('time').textContent=Math.floor(duration/60)+':'+String(duration%60).padStart(2,'0');display()}
 function start(){reset();active=true;started=performance.now();input.disabled=false;$('dur').disabled=true;$('kind').disabled=true;$('start').disabled=true;$('message').textContent='Keep typing. Fix mistakes with Backspace.';input.focus();raf=requestAnimationFrame(clock)}
 function finish(){if(!active)return;cancelAnimationFrame(raf);active=false;finished=true;input.disabled=true;$('start').disabled=false;$('dur').disabled=false;$('kind').disabled=false;remaining=0;$('time').textContent='0:00';display();const accuracy=entries?Math.round(100*correctEntries/entries):100;const wpm=Math.round((completedChars+countCorrect(typed,expected()))/5/(duration/60));$('finalWpm').textContent=wpm;$('finalAcc').textContent=accuracy+'%';$('finalCount').textContent=completed;const resultStrong=accuracy>=95&&wpm>=35;$('resultDino').src=resultStrong?mascots.great:mascots.good;$('resultTitle').textContent=resultStrong?'A very solid sprint.':'Sprint complete.';$('resultSubtitle').textContent=accuracy>=95?'Your accuracy is strong. Build speed gradually.':accuracy>=85?'Good effort. Aim for fewer errors before increasing speed.':'Focus on accuracy first. A slower clean run is useful practice.';const tips=[];if(accuracy<95)tips.push('Try another round at a comfortable pace and prioritize correct keys.');else tips.push('Keep accuracy high as you gradually increase your typing pace.');tips.push('Compare several sessions, not just one sprint.');$('tips').innerHTML=tips.map(t=>'<li>'+esc(t)+'</li>').join('');$('result').classList.add('show');$('mascot').style.display='none';$('message').textContent='Sprint finished. Review your results below.'}
 input.addEventListener('paste',e=>e.preventDefault());input.addEventListener('drop',e=>e.preventDefault());
 input.addEventListener('input',()=>{if(!active)return;const now=input.value;const ref=expected();const prefix=(()=>{let i=0;while(i<prevValue.length&&i<now.length&&prevValue[i]===now[i])i++;return i})();if(now.length>prevValue.length){const added=now.slice(prefix);for(let j=0;j<added.length;j++){entries++;if(added[j]===ref[prefix+j])correctEntries++}}typed=now;prevValue=now;if(typed===ref){completedChars+=ref.length;completed++;index++;if(index>=order.length){shuffle();index=0}typed='';prevValue='';input.value='';$('dinoText').textContent=completed%3===0?'Three more sentences down. Nicely done.':'Keep it going.';}display()});
 $('start').onclick=start;$('restart').onclick=reset;$('again').onclick=start;root.addEventListener('keydown',e=>{if(kind==='sentences'&&e.key==='Enter'&&e.target===input)e.preventDefault()});$('kind').onchange=()=>{if(!active)reset()};$('dur').onchange=()=>{if(!active)reset()};reset();
})();
</script></body></html>
