<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Build a Sentence</title><body style="background:#f5f6f8;padding:25px"><div id="dasha-build-sentence-v3"></div>

const root=mount.attachShadow({mode:'open'});
root.innerHTML=`<style>

rder:1px solid #e1e6ed;background:white;border-radius:10px;padding:9px 12px;min-height:40px;flex:1}.bubble.reply{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.static{font-weight:700;padding:3px 1px}.punct{font-weight:750}.slot{border:1px dashed #9faec2;background:#f0f4f9;border-radius:7px;min-width:51px;min-height:35px;padding:7px 8px;font-size:12px;color:#253248;font-weight:750}.slot.filled{border-style:solid;background:#e7edf7}.slot.target{outline:2px solid #7295c6}.slot.correct{background:#e0f5e9;border-color:#3d9367}.slot.incorrect{background:#ffefea;border-color:#cc7463}.bankhead{margin:13px 0 7px;font-size:10px;font-weight:850;letter-spacing:.7px;color:#687992}.bank{display:flex;flex-wrap:wrap;gap:7px;border:1px solid #e0e5ee;border-radius:10px;background:#eff2f7;padding:10px;min-height:55px}.tile{touch-action:none;background:#fff;border:1px solid #cbd5e2;border-radius:8px;padding:8px 11px;font-size:12px;font-weight:750;color:#243047;min-height:35px}.tile.used{visibility:hidden}.help{font-size:11px;color:#7c899b;margin:9px 0 0}.buttons{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.btn{border-radius:9px;padding:9px 13px;background:white;border:1px solid #d7e0eb;color:#243047;font-weight:750;font-size:12px}.btn.primary{background:#243047;color:white;border-color:#243047}.feedback{margin-top:13px;padding:13px 14px;border:1px solid #e0e6ee;border-radius:10px;background:#f5f7fa;font-size:13px}.feedback p{margin:6px 0}.feedback strong{display:block;margin-bottom:7px}.hidden{display:none!important}.foot{font-size:10px;margin-top:10px;color:#8a97a8}.dragGhost{position:fixed;z-index:9999999;background:white;border:2px solid #6e91cb;border-radius:8px;box-shadow:0 6px 16px #0002;padding:8px 12px;pointer-events:none;font-size:12px;font-weight:750}.intro{padding:16px;background:#f7f8fb;border-radius:12px;border:1px solid #dfe4ec}.intro h3{margin:0 0 8px;font-size:19px}.intro p{margin:7px 0}.results{margin-top:12px;display:grid;gap:7px}.result{border:1px solid #e0e5ee;border-radius:9px;padding:10px 12px;font-size:12px}.result b{display:block;margin-bottom:4px}.warn{color:#b04b3d}@media(max-width:550px){.top{padding:13px}.main{padding:13px}.panel{padding:11px}.top h2{font-size:19px}.face{flex-basis:32px;width:32px;height:32px;font-size:21px}.bubbleRow{gap:7px}.bubble{padding:9px}.slot{min-width:42px;padding:7px 5px}.tile{padding:8px}.switch button{padding:7px 10px}}
</style><div class="app"><header class="top"><div><div class="eyebrow">DASHA ENGLISH / TOEFL WRITING</div><h2>Build a Sentence</h2></div><div class="switch"><button id="practice" class="active" type="button">Practice</button><button id="exam" type="button">Exam</button></div></header><div class="main"><div class="stats"><span id="progress"></span><span class="clock" id="clock"></span></div><div id="dots" class="dots"></div><div id="intro" class="intro hidden"><h3>Timed exam</h3><p>10 questions · 6 minutes total. Questions appear one at a time. Use Next to submit a response and move on.</p><p>You cannot return to previous questions or check your answers until the exam ends. Unused time remains available for later questions.</p></div><section id="question" class="panel"><p class="instruction">Make an appropriate sentence.</p><div class="bubbleRow"><span class="face" aria-label="First speaker">👩🏻‍🎓</span><div id="prompt" class="bubble"></div></div><div class="bubbleRow"><span class="face two" aria-label="Second speaker">👨🏽‍🎓</span><div id="reply" class="bubble reply"></div></div><div class="bankhead">WORD BANK · TAP OR DRAG</div><div id="bank" class="bank"></div><p class="help">Tap chunks to fill the next blank. Tap a filled blank to remove it. You can also drag chunks into blanks.</p></section><div class="buttons"><button id="check" class="btn primary">Check answer</button><button id="clear" class="btn">Clear</button><button id="prev" class="btn">← Previous</button><button id="next" class="btn primary">Next →</button><button id="start" class="btn primary hidden">Start exam</button><button id="finish" class="btn hidden">Finish exam early</button><button id="restart" class="btn hidden">Try again</button></div><div id="feedback" class="feedback hidden"></div><div id="results" class="results hidden"></div><div class="foot">Independent TOEFL-style practice · Not affiliated with ETS · 6-minute timer is an approximate practice allocation.</div></div></div>`;
const $=id=>root.getElementById(id);
const RAW=[
{prompt:'The career fair last night was very impressive.',answer:'Can you tell me whether it will be held again next month?',parts:['Can',null,null,null,null,null,null,null,'?'],chunks:['you tell','me','whether','it will be','held again','next','month'],grammar:'Embedded yes/no question',explain:'After “Can you tell me whether,” the clause uses statement word order: “it will be held,” not “will it be held.”'},
{prompt:'I finished reading the book you lent me.',answer:'Can I have it back now?',parts:[null,null,null,null,null,'now','?'],chunks:['Can','I','have','it','back'],grammar:'Modal yes/no question',explain:'Use “Can + subject + base verb” to make a request: “Can I have…?”'},
{prompt:'I have a job interview scheduled for Tuesday for a new research assistant position.',answer:'Can you tell me whether you prepared your answers in advance?',parts:['Can you',null,null,null,null,null,null,'?'],chunks:['tell me','whether you','prepared','your','answers in','advance'],grammar:'Embedded yes/no question',explain:'After “whether,” use statement word order. The question is “Can you tell me…?” not “whether did you prepare…?”'},
{prompt:'What did that girl just ask you?',answer:'She wanted to know what chapters were covered in our seminar.',parts:[null,null,'what',null,null,null,null,'.'],chunks:['She','wanted to know','chapters','were covered','in','our seminar'],grammar:'Embedded wh-question + passive voice',explain:'In “what chapters were covered,” the noun phrase “what chapters” is the subject of a passive clause.'},
{prompt:'The seminar on modern art was fascinating.',answer:'Do you know if they will hold another session soon?',parts:[null,null,null,null,null,null,'soon','?'],chunks:['Do you','know','if','they','will hold','another session'],grammar:'Embedded yes/no question',explain:'After “if,” the clause has statement order: “they will hold,” not “will they hold.”'},
{prompt:"I'm thinking about moving off campus next semester.",answer:'Have you found a place you like?',parts:['Have',null,null,null,null,null,'?'],chunks:['you','found','a','place','you like'],grammar:'Present perfect question + relative clause',explain:'Present perfect questions use “Have + subject + past participle.” “You like” identifies the place without an expressed relative pronoun.'},
{prompt:'I heard there was a new photography exhibition at the university last Sunday.',answer:'Did you also happen to attend it?',parts:['Did',null,null,null,null,'?'],chunks:['you','also','happen to','attend it'],grammar:'Past simple question + verb pattern',explain:'After “did,” use the base verb “happen”; “happen to” is followed by another base verb.'},
{prompt:'When will the Science Department meeting start?',answer:'I need to find out when everyone is available to meet.',parts:[null,null,null,'when everyone',null,null,'.'],chunks:['I need','to find','out','is available','to meet'],grammar:'Embedded wh-clause',explain:'The embedded clause follows statement order: “when everyone is available,” not “when is everyone available.”'},
{prompt:"I've decided to study sculpture at my university.",answer:"Do you have all the supplies you'll need?",parts:['Do',null,null,null,null,null,null,'?'],chunks:['you','have','all','the','supplies',"you'll need"],grammar:'Present simple question + relative clause',explain:'“Do + subject + base verb” makes the main question. “You’ll need” modifies “supplies” as a relative clause.'},
{prompt:'What time does the cafeteria close on Mondays?',answer:"The cafeteria closes at 7 o'clock on Mondays.",parts:[null,null,null,null,null,null,null,'.'],chunks:['The','cafeteria','closes','at',"7 o'clock",'on','Mondays'],grammar:'Present simple + time expressions',explain:'Use present simple for regular schedules, followed by the time and “on + day(s).”'}
];

const questions=RAW.map((q,i)=>{let n=0;const parts=q.parts.map(p=>p===null?{kind:'slot',n:n++}:{kind:/^[?.!]$/.test(p)?'punct':'fixed',text:p});if(n!==q.chunks.length)throw Error('Invalid question '+i);return {...q,parts,tiles:q.chunks.map((t,j)=>({id:j,text:t})),correct:q.chunks.map((_,j)=>j)};});
function mix(n){const a=Array.from({length:n},(_,i)=>i);for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}if(n>1&&a.every((v,i)=>v===i))[a[0],a[1]]=[a[1],a[0]];return a}
function makeOrders(){return questions.map(q=>mix(q.tiles.length))}
let orders=makeOrders(),answers=questions.map(q=>Array(q.tiles.length).fill(null)),checks=Array(questions.length).fill(false),mode='practice',index=0,phase='ready',remaining=360,deadline=0,interval=null;
function stop(){if(interval!==null)clearInterval(interval);interval=null}
function reset(nextMode){stop();mode=nextMode;orders=makeOrders();answers=questions.map(q=>Array(q.tiles.length).fill(null));checks=Array(questions.length).fill(false);index=0;phase=mode==='exam'?'ready':'active';remaining=360;render()}
function locked(){return phase==='done'||(mode==='exam'&&phase!=='active')||(mode==='practice'&&checks[index])}
function correct(i){return answers[i].every((v,j)=>v===j)}
function textOf(id){return questions[index].tiles[id]?.text||''}
function assign(id,pos){if(locked())return;const a=answers[index];const old=a.indexOf(id);const displaced=a[pos];if(old===pos)return;if(old>=0)a[old]=displaced??null;a[pos]=id;render()}
function remove(pos){if(locked())return;answers[index][pos]=null;render()}
function clockTick(){remaining=Math.max(0,(deadline-Date.now())/1000);$('clock').textContent=formatTime(remaining);$('clock').classList.toggle('low',remaining<=45);if(remaining<=0)finish()}
function formatTime(n){const s=Math.ceil(n);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function finish(){if(phase==='done')return;phase='done';stop();render()}
function next(){if(mode==='exam'){if(index===questions.length-1)finish();else{index++;render()}return}index=Math.min(index+1,questions.length-1);render()}
function dragStart(e,id){if(locked()||e.button!==0)return;const x=e.clientX,y=e.clientY;let ghost=null,moved=false;const mv=ev=>{if(!moved&&Math.hypot(ev.clientX-x,ev.clientY-y)>7){moved=true;ghost=document.createElement('div');ghost.className='dragGhost';ghost.textContent=textOf(id);root.appendChild(ghost)}if(ghost){ghost.style.left=ev.clientX+10+'px';ghost.style.top=ev.clientY+10+'px'}};const end=ev=>{window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',end);window.removeEventListener('pointercancel',end);const target=root.elementFromPoint?.(ev.clientX,ev.clientY)?.closest('.slot');ghost?.remove();if(moved&&target)assign(id,Number(target.dataset.slot))};window.addEventListener('pointermove',mv);window.addEventListener('pointerup',end);window.addEventListener('pointercancel',end)}
function render(){const q=questions[index],a=answers[index],isDone=phase==='done',exam=mode==='exam',canEdit=!locked();$('practice').classList.toggle('active',!exam);$('exam').classList.toggle('active',exam);$('clock').textContent=exam?formatTime(remaining):'Untimed';$('clock').classList.toggle('low',exam&&remaining<=45&&phase==='active');$('progress').textContent=isDone?'Exam finished · '+questions.filter((_,i)=>correct(i)).length+' / '+questions.length+' correct':'Question '+(index+1)+' of '+questions.length+' · '+(exam?'Exam mode':'Practice mode');$('intro').classList.toggle('hidden',!(exam&&phase==='ready'));$('question').classList.toggle('hidden',exam&&phase!=='active'||isDone);$('dots').classList.toggle('hidden',isDone);$('dots').replaceChildren();questions.forEach((_,i)=>{const b=document.createElement('button');b.type='button';b.textContent=i+1;b.className=(i===index?'now ':'')+(answers[i].every(v=>v!==null)?'completed':'');b.disabled=exam||phase!=='active';b.title=exam?'Exam questions are sequential':'Go to question '+(i+1);b.onclick=()=>{index=i;render()};$('dots').append(b)});$('prompt').textContent=q.prompt;$('reply').replaceChildren();q.parts.forEach(p=>{if(p.kind!=='slot'){let sp=document.createElement('span');sp.className=p.kind==='punct'?'punct':'static';sp.textContent=p.text;$('reply').append(sp);return}const b=document.createElement('button');b.type='button';b.dataset.slot=p.n;b.className='slot'+(a[p.n]!==null?' filled':'');b.textContent=a[p.n]===null?'_____':textOf(a[p.n]);b.disabled=!canEdit;b.onclick=()=>remove(p.n);if(!exam&&checks[index])b.classList.add(a[p.n]===p.n?'correct':'incorrect');$('reply').append(b)});$('bank').replaceChildren();orders[index].forEach(id=>{const b=document.createElement('button');b.type='button';b.className='tile'+(a.includes(id)?' used':'');b.textContent=q.tiles[id].text;b.disabled=!canEdit||a.includes(id);b.onclick=()=>{const pos=a.indexOf(null);if(pos>=0)assign(id,pos)};b.addEventListener('pointerdown',e=>dragStart(e,id));$('bank').append(b)});$('check').classList.toggle('hidden',exam||isDone);$('check').disabled=!canEdit||a.some(v=>v===null);$('clear').classList.toggle('hidden',isDone||exam&&phase==='ready');$('clear').disabled=!canEdit;$('prev').classList.toggle('hidden',exam||isDone);$('prev').disabled=index===0;$('next').classList.toggle('hidden',isDone||exam&&phase==='ready');$('next').textContent=exam?(index===questions.length-1?'Submit exam':'Next →'):'Next →';$('next').disabled=!canEdit||!exam&&index===questions.length-1;$('start').classList.toggle('hidden',!(exam&&phase==='ready'));$('finish').classList.toggle('hidden',!(exam&&phase==='active'));$('restart').classList.toggle('hidden',!isDone);$('feedback').classList.toggle('hidden',exam||!checks[index]||isDone);if(!exam&&checks[index]){$('feedback').replaceChildren();const h=document.createElement('strong');h.textContent=(correct(index)?'✓ Correct':'✕ Not quite')+' · '+q.grammar;const p=document.createElement('p');p.textContent='Answer: '+q.answer;const x=document.createElement('p');x.textContent=q.explain;$('feedback').append(h,p,x)}$('results').classList.toggle('hidden',!isDone);if(isDone){$('results').replaceChildren();questions.forEach((q,i)=>{const div=document.createElement('div');div.className='result';const h=document.createElement('b');h.className=correct(i)?'':'warn';h.textContent=(correct(i)?'✓':'✕')+' Question '+(i+1);const p=document.createElement('span');p.textContent=q.answer;div.append(h,p);$('results').append(div)})}}
$('practice').onclick=()=>reset('practice');$('exam').onclick=()=>reset('exam');$('check').onclick=()=>{checks[index]=true;render()};$('clear').onclick=()=>{answers[index].fill(null);render()};$('prev').onclick=()=>{index=Math.max(0,index-1);render()};$('next').onclick=next;$('start').onclick=()=>{phase='active';deadline=Date.now()+remaining*1000;interval=setInterval(clockTick,200);render()};$('finish').onclick=finish;$('restart').onclick=()=>reset(mode);document.addEventListener('visibilitychange',()=>{if(phase==='active'&&mode==='exam')clockTick()});window.addEventListener('pagehide',stop);reset('practice');
})();
