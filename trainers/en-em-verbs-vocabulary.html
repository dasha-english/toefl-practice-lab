function jump(i){record();state.pos=i;persist();render();gotoTop()}
function finish(){record();state.view='result';state.filter='all';persist();render();gotoTop()}
function renderResults(){const qs=indices(),isTest=state.mode==='test';const good=qs.filter(q=>isTest?isRight(q,state.progress[q.id]?.value||''):state.progress[q.id]?.solved);const first=qs.filter(q=>!isTest&&state.progress[q.id]?.solved&&state.progress[q.id]?.attempts===1&&state.progress[q.id]?.hints===0);const raw=qs.filter(q=>String(state.progress[q.id]?.value||'').trim()).length;let pct=Math.round(100*good.length/qs.length);const shown=qs.filter(q=>state.filter==='all'||(state.filter==='wrong'?!good.some(g=>g.id===q.id):good.some(g=>g.id===q.id)));return `<div class="crumb"><a href="https://www.dashaenglish.pro/" target="_blank" rel="noopener noreferrer">dashaenglish.</a><span>/</span><b>Vocabulary Lab</b><span>/</span><span>Review</span></div><section class="results-hero"><span class="eyebrow">${isTest?'Test':'Practice'} complete · ${esc(GROUPS[state.scope].title)}</span><h1>${pct>=90?'Brilliant work.':pct>=65?'Strong progress.':'Keep building.'}</h1><p>Check the words, grammar and explanations below. The goal isn’t just a perfect score — it’s using these verbs naturally in new contexts.</p></section><div class="score-grid"><div class="score-tile"><b>${good.length} / ${qs.length}</b><span>Correct answers · ${pct}%</span></div><div class="score-tile"><b>${qs.length-good.length}</b><span>To review</span></div><div class="score-tile"><b>${isTest?raw:first.length}</b><span>${isTest?'Questions answered':'Correct first try, no hints'}</span></div></div><section><div class="review-header"><h2>Review your answers</h2><div class="filter-row"><button data-filter="all" class="filter ${state.filter==='all'?'active':''}">All (${qs.length})</button><button data-filter="wrong" class="filter ${state.filter==='wrong'?'active':''}">To review (${qs.length-good.length})</button><button data-filter="correct" class="filter ${state.filter==='correct'?'active':''}">Correct (${good.length})</button></div></div><div class="review-list">${shown.length?shown.map(q=>{const p=state.progress[q.id]||{};const ok=isTest?isRight(q,p.value||''):!!p.solved;const parts=q.sentence.split('▁▁▁');const note=p.value?.trim()?`Your answer: <strong>${esc(p.value)}</strong>${isTest&&ok&&normalized(p.value)!==normalized(q.answer)?' · Accepted alternative':''}`:'No answer entered';return `<article class="review-item"><div class="review-top"><span class="review-topic">${q.id.toString().padStart(2,'0')} · ${esc(q.topic)} · ${esc(q.verb)}</span><span class="status ${ok?'':'miss'}">${ok?'Correct':'Review'}</span></div><p class="review-sentence">${esc(parts[0])}<mark>${esc(q.answer)}</mark>${esc(parts[1]||'')}</p><p class="review-note">${note}</p><p class="review-note">${esc(q.note)}${q.alternates.length?` Other acceptable answer: ${esc(q.alternates.join(', '))}.`:''}</p></article>`}).join(''):'<div class="panel" style="padding:20px">Nothing to review in this filter — nice work!</div>'}</div></section><div class="review-end"><div><h3>${state.scope==='round1'?'Ready to use the same verbs in new contexts?':'Keep building your vocabulary.'}</h3><p>${state.scope==='round1'?'Round 2 includes one new sentence for each of the 18 verbs.':'You can return to the beginning or repeat either round.'}</p></div><div style="display:flex;gap:9px;flex-wrap:wrap"><button class="btn secondary" id="start-over">Back to start</button>${state.scope==='round1'?'<button class="btn primary" id="next-round">Start Round 2 →</button>':''}</div></div>`}
function bind(){if(state.view==='setup'){$$('button[data-mode]').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));$$('button[data-scope]').forEach(b=>b.addEventListener('click',()=>setScope(b.dataset.scope)));$('#start')?.addEventListener('click',()=>{state.mode='practice';state.scope='round1';startFresh()});$('#start-test')?.addEventListener('click',()=>{state.mode='test';state.scope='round2';startFresh()});$('#resume')?.addEventListener('click',restore)}else if(state.view==='quiz'){$('#start-over')?.addEventListener('click',restart);$('#overview')?.addEventListener('click',backToOverview);$('#word-answer')?.addEventListener('input',e=>{answerState(current().id).value=e.target.value;persist()});$('#answer-form')?.addEventListener('submit',e=>{e.preventDefault();if(state.mode==='practice'){const p=answerState(current().id);if(p.solved||p.revealed)navigate(1);else check()}else navigate(1)});$('#check')?.addEventListener('click',e=>{e.preventDefault();check()});$('#hint-meaning')?.addEventListener('click',e=>{e.preventDefault();hint(1)});$('#hint-letters')?.addEventListener('click',e=>{e.preventDefault();hint(2)});$('#reveal')?.addEventListener('click',e=>{e.preventDefault();reveal()});$('#prev')?.addEventListener('click',e=>{e.preventDefault();navigate(-1)});$('#next')?.addEventListener('click',e=>{e.preventDefault();navigate(1)});$('#skip')?.addEventListener('click',e=>{e.preventDefault();navigate(1)});$('#submit')?.addEventListener('click',e=>{e.preventDefault();if(confirm('Submit your answers and view the results?'))finish()});$('#wordbank-toggle')?.addEventListener('click',e=>{e.preventDefault();state.wordBank=!state.wordBank;render()});$$('button[data-jump]').forEach(b=>b.addEventListener('click',()=>jump(Number(b.dataset.jump))))}else{$('#start-over')?.addEventListener('click',restart);$('#next-round')?.addEventListener('click',()=>{state.mode='test';state.scope='round2';state.pos=0;state.progress={};state.view='quiz';persist();render();gotoTop()});$$('button[data-filter]').forEach(b=>b.addEventListener('click',()=>{state.filter=b.dataset.filter;render()}))}}
function $$(selector){return [...document.querySelectorAll(selector)]}
render();
</script>
</body>
</html>
